name: Release

# Every push to `production` builds signed installers and publishes a GitHub
# Release. Installed copies of Eardloom read `latest.json` from the newest
# release and offer the update in-app.
#
# Bump "version" in src-tauri/tauri.conf.json (and package.json) before
# merging to production, otherwise the release tag already exists and the
# build is skipped.

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Release notes come from this version's section of CHANGELOG.md.
      - name: Read release notes
        id: notes
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          body=$(awk -v v="## $version" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          {
            echo "body<<EOF_NOTES"
            echo "${body:-Bug fixes and improvements.}" | sed '/./,$!d'
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Eardloom v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
