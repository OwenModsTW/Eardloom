name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npx tsc --noEmit
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # The app's copy of the backend's types must match the Rust code (cargo test regenerates them).
      - name: Generated types are up to date
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- src/generated/bindings)" ]; then
            echo "src/generated/bindings is out of date: run cargo test and commit the changes."
            git status --short -- src/generated/bindings
            exit 1
          fi
